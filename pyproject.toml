[project]
name = "jobflow"
version = "0.1.0"
description = "Python lightweight auto job applier"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.52.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
jobflow = "main:main"